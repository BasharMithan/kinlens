[project]
name = "kinlens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BasharMithan", email = "basharmithan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests", "src/kinlens/tests"]
pythonpath = ["src"]
python_files = ["test*.py", "*_test.py", "*Tests.py"]
python_functions = ["test_*", "test*"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]
